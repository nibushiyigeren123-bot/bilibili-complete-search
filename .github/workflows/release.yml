name: Verify and publish extension
on:
  push:
    branches: [main]
    paths: ['extension/**', 'tests/**', 'package*.json', 'build.py', 'scripts/install.ps1', 'docs/RELEASE.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Read the published source commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify matching and page behavior
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build and publish the extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build.py
          VERSION=$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "$TAG · B站搜索完整包含" --notes-file docs/RELEASE.md
          fi
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file docs/RELEASE.md
          gh release upload "$TAG" "bilibili-complete-search-${TAG}.zip" scripts/install.ps1 --repo "${GITHUB_REPOSITORY}" --clobber
