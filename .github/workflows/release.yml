name: Verify and publish extension
on:
  push:
    branches: [main]
    paths: ['extension/**', 'build.py', 'scripts/install.ps1', 'docs/RELEASE.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Read the published source commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify matching and page behavior
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build and publish the extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build.py
          if ! gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create v1.0.0 --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "v1.0.0 · B站搜索完整包含" --notes-file docs/RELEASE.md
          fi
          gh release edit v1.0.0 --repo "${GITHUB_REPOSITORY}" --notes-file docs/RELEASE.md
          gh release upload v1.0.0 bilibili-complete-search-v1.0.0.zip scripts/install.ps1 --repo "${GITHUB_REPOSITORY}" --clobber
          if gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq 'B._v1.0.0.zip'; then
            gh release delete-asset v1.0.0 'B._v1.0.0.zip' --repo "${GITHUB_REPOSITORY}" --yes
          fi
